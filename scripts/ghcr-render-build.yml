# Copy this file to: .github/workflows/render-build.yml
# Needs GitHub PAT with workflow + write:packages scopes (or paste via GitHub web UI).
name: Build Web Docker (GHCR)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mofasal-web:latest
            ghcr.io/${{ github.repository_owner }}/mofasal-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://mofasal-api.onrender.com/api/v1

      - name: Deploy on Render (pull GHCR image)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        if: env.RENDER_API_KEY != ''
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/srv-d86mqe0g4nts73b3foh0/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"imageUrl":"ghcr.io/binniser10/mofasal-web:latest","deployMode":"deploy_only"}'
