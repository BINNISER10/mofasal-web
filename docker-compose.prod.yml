services:
  api:
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp

  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: mufasal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mufasal

  pgbouncer:
    image: bitnami/pgbouncer:latest
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      PGBOUNCER_DATABASE: postgresql://mufasal:${POSTGRES_PASSWORD}@postgres:5432/mufasal
      PGBOUNCER_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
    depends_on:
      - postgres

  redis:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  reports:
    build:
      context: ./services/reports-py
      dockerfile: Dockerfile
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
    environment:
      DATABASE_URL: postgresql+asyncpg://mufasal:${POSTGRES_PASSWORD}@pgbouncer:6432/mufasal
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${REPORTS_API_KEY}
      DEBUG: "false"
    depends_on:
      - pgbouncer
      - redis
