version: "3.9"

networks:
  mufasal-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certs:

services:
  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: mufasal-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mufasal
      POSTGRES_PASSWORD: mufasal_secret
      POSTGRES_DB: mufasal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mufasal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mufasal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mufasal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mufasal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Server ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: mufasal-api
    restart: unless-stopped
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mufasal:mufasal_secret@pgbouncer:6432/mufasal?pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://mufasal:mufasal_secret@postgres:5432/mufasal
      REDIS_URL: redis://redis:6379
    networks:
      - mufasal-network

  # ─── Next.js Web App ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: mufasal-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4001/api/v1
      NEXT_PUBLIC_APP_URL: https://mufasal.com
    networks:
      - mufasal-network

  # ─── PgBouncer (Connection Pooling) ──────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: mufasal-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      PGBOUNCER_DATABASE: postgresql://mufasal:mufasal_secret@postgres:5432/mufasal
      PGBOUNCER_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mufasal-network

  # ─── Reports & Analytics Microservice (Python) ──────────
  reports:
    build:
      context: ./services/reports-py
      dockerfile: Dockerfile
    container_name: mufasal-reports
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - pgbouncer
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mufasal:mufasal_secret@pgbouncer:6432/mufasal
      REDIS_URL: redis://redis:6379/0
    networks:
      - mufasal-network

  # ─── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mufasal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
      - reports
    networks:
      - mufasal-network
