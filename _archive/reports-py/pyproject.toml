[project]
name = "mufasal-reports"
version = "1.0.0"
description = "MUFASAL Reports & Heavy Tasks Microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.3",
    "weasyprint>=60.0",
]

[project.scripts]
mufasal-reports = "app.main:start"

[tool.ruff]
line-length = 120
target-version = "py311"
