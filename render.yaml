# Render Blueprint — mofasal-web (خفيف لخطة Starter 512MB)
services:
  - type: web
    name: mofasal-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: master
    buildCommand: bash scripts/render-build.sh
    startCommand: cd apps/web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: GENERATE_SOURCEMAP
        value: "false"
