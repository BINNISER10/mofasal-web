# Render — صورة جاهزة من GitHub Actions (لا build على Render)
services:
  - type: web
    name: mofasal-web
    runtime: image
    region: frankfurt
    plan: starter
    image:
      url: ghcr.io/binniser10/mofasal-web:latest
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
