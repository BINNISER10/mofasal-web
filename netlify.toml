# مفصل — Netlify monorepo (npm workspaces من الجذر)
# في لوحة Netlify: اترك Base directory فارغاً (الجذر)

[build]
  command = "npm ci && npm run build --workspace=@mufasal/web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  GIT_SUBMODULE_STRATEGY = "none"
  NODE_VERSION = "20"
  NETLIFY = "true"
  NPM_CONFIG_WORKSPACES_UPDATE = "false"
  NEXT_TELEMETRY_DISABLED = "1"
  GENERATE_SOURCEMAP = "false"
  NODE_OPTIONS = "--max-old-space-size=6144"
  DATABASE_URL = "postgresql://build:build@localhost:5432/build?schema=public"
  DIRECT_DATABASE_URL = "postgresql://build:build@localhost:5432/build?schema=public"
  NEXT_PUBLIC_API_URL = "https://mufasal-api.onrender.com/api/v1"
  NEXT_PUBLIC_DEMO_MODE = "true"

[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://mofasal.netlify.app"

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
