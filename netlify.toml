# مفصل — نشر الويب على Netlify (الواجهة فقط)
# API يُستضاف على Render: render-api-only.yaml

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  NPM_CONFIG_MAXSOCKETS = "2"
  NODE_OPTIONS = "--max-old-space-size=6144"
  NEXT_TELEMETRY_DISABLED = "1"
  DATABASE_URL = "postgresql://build:build@localhost:5432/build?schema=public"
  DIRECT_DATABASE_URL = "postgresql://build:build@localhost:5432/build?schema=public"
  # حدّث بعد نشر API على Render:
  NEXT_PUBLIC_API_URL = "https://mufasal-api.onrender.com/api/v1"
  NEXT_PUBLIC_DEMO_MODE = "true"

[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://mufasal.netlify.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
