# مفصل — Netlify (Next.js monorepo)

[build]
  command = "cd apps/web && npm ci --no-audit --no-fund --ignore-scripts --omit=optional && npx prisma generate --schema=./prisma/schema.prisma && npm run build"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  GIT_SUBMODULE_STRATEGY = "none"
  NODE_VERSION = "20"
  NETLIFY = "true"
  NPM_CONFIG_MAXSOCKETS = "2"
  NODE_OPTIONS = "--max-old-space-size=6144"
  NEXT_TELEMETRY_DISABLED = "1"
  GENERATE_SOURCEMAP = "false"
  DATABASE_URL = "postgresql://build:build@localhost:5432/build?schema=public"
  DIRECT_DATABASE_URL = "postgresql://build:build@localhost:5432/build?schema=public"
  NEXT_PUBLIC_API_URL = "https://mofasal-api.onrender.com/api/v1"
  NEXT_PUBLIC_DEMO_MODE = "true"

[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://mofasal.netlify.app"

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
